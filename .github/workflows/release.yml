name: Release Package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version suffix, for example v0.1.0"
        required: false
        type: string
      publish_nexusmods:
        description: "Upload this package to Nexus Mods"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "car-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.package_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}"
            } else {
              $version = "manual-${{ github.run_number }}"
            }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build package
        id: package
        shell: pwsh
        run: |
          ./package-release.ps1 -PackageVersion "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS2VehicleBoardingFastForward-${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true

      - name: Resolve Nexus Mods publish
        id: nexusmods
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID_BOARDING }}
        run: |
          $manualPublish = "${{ github.event.inputs.publish_nexusmods }}" -eq "true"
          $tagPublish = "${{ github.ref_type }}" -eq "tag"
          $requested = $manualPublish -or $tagPublish
          $hasApiKey = -not [string]::IsNullOrWhiteSpace($env:NEXUSMODS_API_KEY)
          $hasFileId = -not [string]::IsNullOrWhiteSpace($env:NEXUSMODS_FILE_ID)
          $configured = $hasApiKey -and $hasFileId
          if ($manualPublish -and -not $configured) {
            throw "Nexus Mods publishing requested, but NEXUSMODS_API_KEY or NEXUSMODS_FILE_ID_BOARDING is missing."
          }
          if ($tagPublish -and -not $configured) {
            Write-Warning "Skipping Nexus Mods publish; configure NEXUSMODS_API_KEY and NEXUSMODS_FILE_ID_BOARDING."
          }
          $enabled = $requested -and $configured
          "enabled=$($enabled.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Nexus Mods Release
        if: steps.nexusmods.outputs.enabled == 'true'
        id: nexusmods_upload
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          ./tools/publish-nexusmods.ps1 `
            -FilePath "${{ steps.package.outputs.zip_path }}" `
            -ModFileId "${{ vars.NEXUSMODS_FILE_ID_BOARDING }}" `
            -Version "${{ steps.version.outputs.value }}" `
            -DisplayName "DS2VehicleBoardingFastForward ${{ steps.version.outputs.value }}" `
            -Description "Automated release from GitHub run ${{ github.run_id }}" `
            -ArchiveExistingFile
