[package]
name = "ds2-spotify-connect-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
autobins = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "ds2_spotify_connect_dev_host"
path = "src/dev_host.rs"

[dependencies]
aes = "0.8"
base64 = "0.22.1"
bytes = "1"
ctr = "0.9"
env_logger = "0.11.8"
form_urlencoded = "1.2"
futures-util = "0.3.31"
http-body-util = "0.1"
hmac = "0.12"
hyper = { version = "1.6", features = ["http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
if-addrs = "0.14.0"
librespot = { git = "https://github.com/librespot-org/librespot.git", rev = "9c7d75615fc093bdcbdb29adbce3fed38c531852", default-features = false, features = ["native-tls"] }
log = "0.4.27"
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
socket2 = "0.6.1"
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "sync", "time"] }
tungstenite = "0.26.2"
ureq = "2.12.1"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
