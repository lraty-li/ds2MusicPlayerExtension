[package]
name = "ds2-spotify-connect-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
base64 = "0.22.1"
env_logger = "0.11.8"
futures-util = "0.3.31"
if-addrs = "0.14.0"
librespot = { git = "https://github.com/librespot-org/librespot.git", rev = "9c7d75615fc093bdcbdb29adbce3fed38c531852", default-features = false, features = ["native-tls", "with-libmdns"] }
log = "0.4.27"
serde_json = "1.0.145"
sha1 = "0.10.6"
socket2 = "0.6.1"
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
tungstenite = "0.26.2"
ureq = "2.12.1"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
