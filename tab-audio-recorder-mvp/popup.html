<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DS2 Audio Stream</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>DS2 Audio Stream</h1>
      <p id="status">Loading</p>
    </div>
    <button id="refresh" title="Refresh">Refresh</button>
  </header>

  <section class="controls">
    <button id="toggle">Start / Stop</button>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>
    <button id="metadata">Read Metadata</button>
  </section>

  <section>
    <h2>Current Page Metadata</h2>
    <dl>
      <dt>Title</dt>
      <dd id="read-title">-</dd>
      <dt>Artist</dt>
      <dd id="read-artist">-</dd>
      <dt>Source</dt>
      <dd id="read-source">-</dd>
    </dl>
  </section>

  <section>
    <h2>Last Metadata Sent To Game</h2>
    <dl>
      <dt>Title</dt>
      <dd id="sent-title">-</dd>
      <dt>Artist</dt>
      <dd id="sent-artist">-</dd>
      <dt>Source</dt>
      <dd id="sent-source">-</dd>
      <dt>Sent At</dt>
      <dd id="sent-at">-</dd>
    </dl>
  </section>

  <section>
    <h2>Last Control Result</h2>
    <pre id="control-result">-</pre>
  </section>

  <script src="popup.js"></script>
</body>
</html>
